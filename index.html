<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Slot AI Studio 测试界面</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    textarea { width: 100%; height: 100px; margin-bottom: 10px; }
    button { padding: 10px 20px; font-size: 16px; }
    pre { background: #f0f0f0; padding: 10px; }
  </style>
</head>
<body>

  <h1>Slot AI Studio 测试界面</h1>

  <!-- 输入框：用户输入消息 -->
  <textarea id="userInput" placeholder="请输入你的问题或指令"></textarea>

  <!-- 生成按钮 -->
  <button id="generateBtn">生成 AI 回复</button>

  <!-- 显示模型回复 -->
  <h2>模型回复：</h2>
  <pre id="output">等待生成...</pre>

  <script>
    const generateBtn = document.getElementById("generateBtn");
    const userInput = document.getElementById("userInput");
    const output = document.getElementById("output");

    generateBtn.addEventListener("click", async () => {
      const message = userInput.value.trim();
      if (!message) {
        alert("请输入内容！");
        return;
      }

      // 显示加载中
      output.textContent = "生成中...";

      try {
        // 调用 Vercel Serverless Function
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "deepseek/deepseek-v3.2-251201",
            messages: [{ role: "user", content: message }]
          })
        });

        const data = await res.json();

        if (data.success) {
          output.textContent = data.content; // 显示 AI 回复
        } else {
          output.textContent = `生成失败: ${data.error || "未知错误"}`;
        }

      } catch (err) {
        output.textContent = `请求出错: ${err.message}`;
      }
    });
  </script>
</body>
</html>
