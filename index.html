<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Slot AI Studio - 文件参考生成策划案</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    textarea { width: 100%; height: 80px; margin-bottom: 10px; }
    select, button { padding: 10px; margin-right: 10px; font-size: 16px; }
    pre { background: #f0f0f0; padding: 10px; white-space: pre-wrap; }
    hr { margin: 20px 0; }
  </style>
</head>
<body>

<h1>Slot AI Studio - 生成策划案（可上传参考文件）</h1>

<!-- 模型选择 -->
<label>选择模型:</label>
<select id="modelSelect">
  <option value="deepseek/deepseek-v3.2-251201">DeepSeek V3.2</option>
  <option value="anthropic/claude-v1">Claude V1</option>
  <option value="gemini/gemini-1">Gemini-1</option>
</select>

<hr>

<!-- 游戏主题输入 -->
<h2>Step 1: 输入 slot 游戏主题</h2>
<textarea id="themeInput" placeholder="请输入 slot 游戏主题"></textarea>
<br>

<!-- 上传参考文件 -->
<h2>Step 2: 上传参考策划案文件（TXT / JSON）</h2>
<input type="file" id="referenceFile" />
<br><br>

<button id="generatePlanBtn">生成策划案</button>
<pre id="planOutput">等待生成...</pre>

<script>
const modelSelect = document.getElementById("modelSelect");
const themeInput = document.getElementById("themeInput");
const referenceFile = document.getElementById("referenceFile");
const generatePlanBtn = document.getElementById("generatePlanBtn");
const planOutput = document.getElementById("planOutput");

// ⚙️ API Key + BaseURL 配置
const apiKeys = {
  "deepseek/deepseek-v3.2-251201": "sk-367b04d6b9a8170fe6065263a3bf11bf17b6a3a8f5e39f446e168151d0f439a3",
  "anthropic/claude-v1": "YOUR_CLAUDE_API_KEY",
  "gemini/gemini-1": "YOUR_GEMINI_API_KEY"
};

const baseURLs = {
  "deepseek/deepseek-v3.2-251201": "https://api.qnaigc.com/v1",
  "anthropic/claude-v1": "https://api.qnaigc.com",
  "gemini/gemini-1": "https://api.qnaigc.com"
};

// -------------------------
// 点击生成策划案
// -------------------------
generatePlanBtn.addEventListener("click", async () => {
  const theme = themeInput.value.trim();
  if (!theme) return alert("请输入游戏主题！");
  planOutput.textContent = "生成中...";

  const messages = [{ role: "user", content: `请根据以下 slot 游戏主题生成详细策划案：\n主题：${theme}` }];

  const formData = new FormData();
  formData.append("model", modelSelect.value);
  formData.append("apiKey", apiKeys[modelSelect.value]);
  formData.append("baseURL", baseURLs[modelSelect.value]);
  formData.append("messages", JSON.stringify(messages));

  // 如果上传了参考文件
  if (referenceFile.files[0]) {
    formData.append("referenceFile", referenceFile.files[0]);
  }

  try {
    const res = await fetch("/api/generate", { method: "POST", body: formData });
    const data = await res.json();
    planOutput.textContent = data.success ? data.content : `生成失败: ${data.error || "未知错误"}`;
  } catch (err) {
    planOutput.textContent = `请求出错: ${err.message}`;
  }
});
</script>

</body>
</html>
