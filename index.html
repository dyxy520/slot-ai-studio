<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot AI Studio - 美术提示词生成器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body { 
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 步骤指示器 */
    .step-indicator {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      position: relative;
    }

    .step-indicator::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255,255,255,0.2);
      transform: translateY(-50%);
      z-index: 1;
    }

    .step {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      padding: 12px 30px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      position: relative;
      z-index: 2;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .step.active {
      background: white;
      color: #764ba2;
      border-color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .step.completed {
      background: #4CAF50;
      border-color: #4CAF50;
      color: white;
    }

    .step.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 主卡片 */
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .card.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-header h2 {
      color: #333;
      font-size: 24px;
      font-weight: 600;
    }

    .card-header .step-badge {
      background: #667eea;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 15px;
    }

    /* 输入区域 */
    .input-group {
      margin-bottom: 25px;
    }

    .input-group label {
      display: block;
      color: #555;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group label .optional {
      color: #999;
      font-weight: normal;
      text-transform: none;
      margin-left: 8px;
      font-size: 12px;
    }

    .input-group label .tool-badge {
      background: #f0f0f0;
      color: #666;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 10px;
      font-weight: normal;
      text-transform: none;
    }

    textarea, input, select { 
      width: 100%; 
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      transition: all 0.3s;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    textarea.format-input {
      height: 150px;
      font-family: 'Consolas', monospace;
      font-size: 14px;
    }

    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }

    select {
      background: white;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 15px center;
      background-size: 15px;
    }

    /* 格式预设卡片 */
    .format-presets {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .preset-btn {
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      color: #666;
    }

    .preset-btn:hover {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .preset-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    /* 工具选择区域 - 5个工具 */
    .tool-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .tool-card {
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px 15px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      position: relative;
    }

    .tool-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .tool-card.selected {
      border-color: #667eea;
      background: linear-gradient(135deg, #667eea10 0%, #764ba210 100%);
    }

    .tool-card.domestic {
      border-left: 3px solid #ff9800;
    }

    .tool-card.domestic.selected {
      border-left: 3px solid #ff9800;
      border-color: #ff9800;
    }

    .tool-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .tool-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
      font-size: 16px;
    }

    .tool-desc {
      font-size: 12px;
      color: #666;
    }

    .tool-badge-domestic {
      position: absolute;
      top: 5px;
      right: 5px;
      background: #ff9800;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
    }

    /* 工具参数调节 */
    .param-panel {
      margin-top: 20px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 1px solid #e9ecef;
    }

    .param-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .param-item {
      margin-bottom: 15px;
    }

    .param-item label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #555;
      font-size: 14px;
      text-transform: none;
    }

    .param-item input[type="range"] {
      width: 100%;
      padding: 0;
    }

    /* 提示词示例 */
    .prompt-example {
      background: #e8f4fd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 15px;
      font-size: 13px;
      color: #1976d2;
      border-left: 3px solid #1976d2;
    }

    .prompt-example.domestic {
      background: #fff3e0;
      color: #f57c00;
      border-left: 3px solid #f57c00;
    }

    /* 展开/折叠按钮 */
    .toggle-format {
      background: none;
      border: none;
      color: #667eea;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 15px;
    }

    .toggle-format:hover {
      text-decoration: underline;
    }

    /* 按钮样式 */
    .button-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102,126,234,0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #666;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e0e0e0;
      transform: translateY(-2px);
    }

    .btn-success {
      background: #4CAF50;
      color: white;
    }

    .btn-success:hover:not(:disabled) {
      background: #45a049;
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* 内容区域 */
    .content-area {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      border: 1px solid #e9ecef;
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .content-header h3 {
      color: #333;
      font-size: 18px;
    }

    pre { 
      background: white;
      padding: 20px;
      border-radius: 8px;
      white-space: pre-wrap; 
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid #e9ecef;
      min-height: 200px;
      max-height: 500px;
      overflow-y: auto;
      font-family: 'Consolas', monospace;
    }

    /* 复制按钮 */
    .copy-btn {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
      color: #666;
    }

    .copy-btn:hover {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    /* 提示信息 */
    .info-message {
      background: #e3f2fd;
      border-radius: 8px;
      padding: 12px;
      color: #1976d2;
      font-size: 14px;
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-message.warning {
      background: #fff3e0;
      color: #f57c00;
    }

    .info-message.success {
      background: #e8f5e8;
      color: #4CAF50;
    }

    hr {
      margin: 30px 0;
      border: none;
      border-top: 2px dashed #e0e0e0;
    }

    /* 加载动画 */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .step {
        padding: 8px 16px;
        font-size: 14px;
      }
      
      .btn {
        min-width: 100%;
      }

      .tool-selector {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- 步骤指示器 -->
  <div class="step-indicator">
    <div class="step active" id="step1" onclick="jumpToStep(1)">1. 输入主题</div>
    <div class="step" id="step2" onclick="jumpToStep(2)">2. 生成策划案</div>
    <div class="step" id="step3" onclick="jumpToStep(3)">3. 选择工具 & 提取美术提示词</div>
  </div>

  <!-- 第一步：输入主题卡片 -->
  <div class="card" id="step1Card">
    <div class="card-header">
      <div class="step-badge">1</div>
      <h2>输入游戏主题</h2>
    </div>
    
    <div class="input-group">
      <label>🎰 Slot 游戏主题</label>
      <textarea id="themeInput" placeholder="例如：古埃及宝藏主题 Slot&#10;或者：海洋冒险主题 Slot&#10;或者：水果乐园主题 Slot">古埃及宝藏主题 Slot</textarea>
    </div>

    <!-- 格式参考选项 -->
    <div class="input-group">
      <label>
        📋 策划案格式参考 
        <span class="optional">(可选，自定义输出格式)</span>
      </label>
      
      <div class="format-presets">
        <button class="preset-btn active" data-preset="standard">📊 标准格式</button>
        <button class="preset-btn" data-preset="detailed">📑 详细格式</button>
        <button class="preset-btn" data-preset="concise">📝 简洁格式</button>
        <button class="preset-btn" data-preset="technical">🔧 技术格式</button>
      </div>

      <button class="toggle-format" id="toggleFormatBtn">
        <span>▼</span> 自定义格式
      </button>

      <textarea id="formatInput" class="format-input" style="display: none;" placeholder="在这里自定义策划案格式要求..."></textarea>
    </div>

    <div class="button-group">
      <button id="startGenerateBtn" class="btn btn-primary">
        🚀 开始生成策划案
      </button>
    </div>
  </div>

  <!-- 第二步：策划案卡片 -->
  <div class="card disabled" id="step2Card">
    <div class="card-header">
      <div class="step-badge">2</div>
      <h2>生成的策划案</h2>
    </div>

    <div class="content-area">
      <div class="content-header">
        <h3>📋 完整游戏策划案</h3>
        <button id="copyPlanBtn" class="copy-btn" style="display: none;">📋 复制策划案</button>
      </div>
      <pre id="planOutput">等待生成策划案...</pre>
    </div>
  </div>

  <!-- 第三步：工具选择 & 美术提示词卡片 -->
  <div class="card disabled" id="step3Card">
    <div class="card-header">
      <div class="step-badge">3</div>
      <h2>选择工具 & 提取美术提示词</h2>
    </div>

    <!-- AI绘画工具选择（5个工具） -->
    <div class="input-group">
      <label>
        🎨 1. 选择AI绘画工具
        <span class="tool-badge" id="selectedToolBadge">当前未选择</span>
      </label>
      
      <div class="tool-selector">
        <!-- 国际工具 -->
        <div class="tool-card" data-tool="midjourney" onclick="selectTool('midjourney')">
          <div class="tool-icon">🎨</div>
          <div class="tool-name">Midjourney</div>
          <div class="tool-desc">艺术风格、创意设计</div>
        </div>
        
        <div class="tool-card" data-tool="sd" onclick="selectTool('sd')">
          <div class="tool-icon">🌌</div>
          <div class="tool-name">Stable Diffusion</div>
          <div class="tool-desc">写实、精细控制</div>
        </div>

        <!-- 国内工具 -->
        <div class="tool-card domestic" data-tool="doubao" onclick="selectTool('doubao')">
          <div class="tool-badge-domestic">国内</div>
          <div class="tool-icon">🫘</div>
          <div class="tool-name">豆包</div>
          <div class="tool-desc">字节跳动出品，中文优化</div>
        </div>
        
        <div class="tool-card domestic" data-tool="jimeng" onclick="selectTool('jimeng')">
          <div class="tool-badge-domestic">国内</div>
          <div class="tool-icon">✨</div>
          <div class="tool-name">即梦</div>
          <div class="tool-desc">创意设计、商业应用</div>
        </div>
        
        <div class="tool-card domestic" data-tool="banbana" onclick="selectTool('banbana')">
          <div class="tool-badge-domestic">国内</div>
          <div class="tool-icon">🎯</div>
          <div class="tool-name">Banbana Pro</div>
          <div class="tool-desc">专业级AI绘画</div>
        </div>
      </div>

      <!-- 工具参数调节面板（根据选择的工具动态显示） -->
      <div class="param-panel" id="paramPanel" style="display: none;">
        <div class="param-title" id="paramTitle">
          <span>⚙️</span> 工具参数设置
        </div>
        
        <!-- Midjourney 参数 -->
        <div id="midjourneyParams" style="display: none;">
          <div class="param-item">
            <label>
              <span>风格化程度 (--stylize)</span>
              <span id="styleValue">100</span>
            </label>
            <input type="range" id="styleSlider" min="0" max="1000" value="100" step="10">
          </div>
          <div class="param-item">
            <label>
              <span>怪异度 (--weird)</span>
              <span id="weirdValue">0</span>
            </label>
            <input type="range" id="weirdSlider" min="0" max="3000" value="0" step="10">
          </div>
        </div>

        <!-- Stable Diffusion 参数 -->
        <div id="sdParams" style="display: none;">
          <div class="param-item">
            <label>
              <span>CFG Scale (提示词相关性)</span>
              <span id="cfgValue">7</span>
            </label>
            <input type="range" id="cfgSlider" min="1" max="20" value="7" step="0.5">
          </div>
          <div class="param-item">
            <label>
              <span>采样步数</span>
              <span id="stepsValue">20</span>
            </label>
            <input type="range" id="stepsSlider" min="10" max="50" value="20" step="1">
          </div>
        </div>

        <!-- 国内工具通用参数 -->
        <div id="domesticParams" style="display: none;">
          <div class="param-item">
            <label>风格偏好</label>
            <select id="domesticStyleSelect">
              <option value="写实">写实风格</option>
              <option value="二次元">二次元/动漫</option>
              <option value="国风">国风/水墨</option>
              <option value="插画">插画/卡通</option>
              <option value="幻想">幻想/奇幻</option>
            </select>
          </div>
          <div class="param-item">
            <label>生成质量</label>
            <select id="qualitySelect">
              <option value="标准">标准</option>
              <option value="高清">高清</option>
              <option value="超清">超清</option>
            </select>
          </div>
        </div>

        <!-- 提示词示例 -->
        <div class="prompt-example" id="toolExample">
          请先选择AI绘画工具
        </div>
      </div>

      <!-- 提取按钮 -->
      <div style="margin-top: 20px;">
        <button id="extractArtBtn" class="btn btn-success" disabled>
          🎨 2. 从策划案提取美术提示词
        </button>
      </div>
    </div>

    <!-- 美术提示词输出区域 -->
    <div class="content-area">
      <div class="content-header">
        <h3>🎨 AI绘画提示词</h3>
        <button id="copyArtBtn" class="copy-btn" style="display: none;">📋 复制提示词</button>
      </div>
      <pre id="artOutput">请先选择AI绘画工具，然后点击提取按钮生成提示词</pre>
    </div>

    <!-- 提示信息区域 -->
    <div id="infoMessage" class="info-message" style="display: none;"></div>
  </div>
</div>

<script>
// 获取DOM元素
const themeInput = document.getElementById("themeInput");
const formatInput = document.getElementById("formatInput");
const toggleFormatBtn = document.getElementById("toggleFormatBtn");
const startGenerateBtn = document.getElementById("startGenerateBtn");
const extractArtBtn = document.getElementById("extractArtBtn");
const copyPlanBtn = document.getElementById("copyPlanBtn");
const copyArtBtn = document.getElementById("copyArtBtn");
const planOutput = document.getElementById("planOutput");
const artOutput = document.getElementById("artOutput");
const infoMessage = document.getElementById("infoMessage");
const selectedToolBadge = document.getElementById("selectedToolBadge");
const paramPanel = document.getElementById("paramPanel");
const paramTitle = document.getElementById("paramTitle");
const midjourneyParams = document.getElementById("midjourneyParams");
const sdParams = document.getElementById("sdParams");
const domesticParams = document.getElementById("domesticParams");
const toolExample = document.getElementById("toolExample");

// 滑块元素
const styleSlider = document.getElementById("styleSlider");
const weirdSlider = document.getElementById("weirdSlider");
const styleValue = document.getElementById("styleValue");
const weirdValue = document.getElementById("weirdValue");
const cfgSlider = document.getElementById("cfgSlider");
const stepsSlider = document.getElementById("stepsSlider");
const cfgValue = document.getElementById("cfgValue");
const stepsValue = document.getElementById("stepsValue");
const domesticStyleSelect = document.getElementById("domesticStyleSelect");
const qualitySelect = document.getElementById("qualitySelect");

// 步骤元素
const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const step3 = document.getElementById("step3");
const step1Card = document.getElementById("step1Card");
const step2Card = document.getElementById("step2Card");
const step3Card = document.getElementById("step3Card");

// 预设按钮
const presetBtns = document.querySelectorAll('.preset-btn');

// 存储数据
let currentPlan = "";
let currentArtPrompt = "";
let currentFormat = "";
let selectedTool = null; // 初始为null，必须选择工具
let currentStep = 1; // 当前步骤

// 固定的模型配置
const MODEL = "deepseek/deepseek-v3.2-251201";

// 格式预设
const formatPresets = {
  standard: `请严格按照以下标准格式输出：

# 【游戏名称】
## 1. 游戏背景
[包含世界观、时代背景、故事情节]

## 2. 玩法机制
[基本规则、特殊玩法、奖励游戏]

## 3. 符号设计
- 普通符号
- 特殊符号（Wild、Scatter、Bonus）

## 4. 奖励系统
[普通奖励、大奖机制、累积奖金]

// 跳转到指定步骤
window.jumpToStep = function(step) {
  // 只能跳转到已完成或当前步骤
  if (step <= currentStep) {
    updateSteps(step);
  }
};

// 更新步骤状态
function updateSteps(step) {
  currentStep = step;
  
  // 更新步骤指示器
  step1.className = "step";
  step2.className = "step";
  step3.className = "step";
  
  if (step >= 1) {
    step1.className = "step completed";
  }
  if (step >= 2) {
    step2.className = "step completed";
  }
  
  // 激活当前步骤
  if (step === 1) {
    step1.className = "step active";
    step1Card.classList.remove("disabled");
    step2Card.classList.add("disabled");
    step3Card.classList.add("disabled");
  } else if (step === 2) {
    step2.className = "step active";
    step1Card.classList.remove("disabled");
    step2Card.classList.remove("disabled");
    step3Card.classList.add("disabled");
  } else if (step === 3) {
    step3.className = "step active";
    step1Card.classList.remove("disabled");
    step2Card.classList.remove("disabled");
    step3Card.classList.remove("disabled");
  }
}

// 选择工具
window.selectTool = function(tool) {
  selectedTool = tool;
  const toolInfo = toolConfig[tool];
  
  // 更新所有工具卡片的选中状态
  document.querySelectorAll('.tool-card').forEach(card => {
    if (card.dataset.tool === tool) {
      card.classList.add('selected');
    } else {
      card.classList.remove('selected');
    }
  });
  
  // 更新徽章
  selectedToolBadge.textContent = `当前选择: ${toolInfo.name}`;
  
  // 显示参数面板
  paramPanel.style.display = 'block';
  
  // 根据工具显示对应的参数
  midjourneyParams.style.display = 'none';
  sdParams.style.display = 'none';
  domesticParams.style.display = 'none';
  
  if (tool === 'midjourney') {
    midjourneyParams.style.display = 'block';
    paramTitle.innerHTML = '<span>⚙️</span> Midjourney 参数设置';
  } else if (tool === 'sd') {
    sdParams.style.display = 'block';
    paramTitle.innerHTML = '<span>⚙️</span> Stable Diffusion 参数设置';
  } else {
    domesticParams.style.display = 'block';
    paramTitle.innerHTML = `<span>⚙️</span> ${toolInfo.name} 参数设置`;
  }
  
  // 更新示例
  const exampleClass = toolInfo.category === 'domestic' ? 'prompt-example domestic' : 'prompt-example';
  toolExample.className = exampleClass;
  toolExample.innerHTML = `<strong>${toolInfo.name} 格式示例:</strong> ${toolInfo.format}`;
  
  // 如果有策划案，启用提取按钮
  if (currentPlan) {
    extractArtBtn.disabled = false;
  }
  
  // 提示
  if (currentPlan) {
    showInfo('info', `已选择 ${toolInfo.name}，点击下方按钮提取美术提示词`);
  } else {
    showInfo('info', `已选择 ${toolInfo.name}，请先完成第二步生成策划案`);
  }
};

// 切换格式输入框显示/隐藏
toggleFormatBtn.addEventListener("click", () => {
  if (formatInput.style.display === "none") {
    formatInput.style.display = "block";
    toggleFormatBtn.innerHTML = '<span>▲</span> 隐藏自定义格式';
  } else {
    formatInput.style.display = "none";
    toggleFormatBtn.innerHTML = '<span>▼</span> 自定义格式';
  }
});

// 预设按钮点击事件
presetBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    presetBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    
    const preset = btn.dataset.preset;
    formatInput.value = formatPresets[preset];
    
    if (formatInput.style.display === "none") {
      formatInput.style.display = "block";
      toggleFormatBtn.innerHTML = '<span>▲</span> 隐藏自定义格式';
    }
    
    currentFormat = formatPresets[preset];
  });
});

// 显示信息提示
function showInfo(type, message) {
  infoMessage.style.display = "flex";
  infoMessage.className = `info-message ${type}`;
  
  const icon = type === "success" ? "✅" : type === "warning" ? "⚠️" : "ℹ️";
  infoMessage.innerHTML = `${icon} ${message}`;
  
  setTimeout(() => {
    infoMessage.style.display = "none";
  }, 3000);
}

// 第一步：生成策划案
startGenerateBtn.addEventListener("click", async () => {
  const theme = themeInput.value.trim();
  const customFormat = formatInput.value.trim();

  if (!theme) {
    showInfo("warning", "请输入游戏主题！");
    return;
  }

  startGenerateBtn.disabled = true;
  startGenerateBtn.innerHTML = '<span class="loading"></span> 生成中...';
  planOutput.textContent = "⏳ 正在生成策划案，请稍候...";
  

  let formatInstruction = "";
  if (customFormat) {
    formatInstruction = `\n\n请严格按照以下格式要求输出：\n${customFormat}`;
  } else {
    formatInstruction = `\n\n要求包含：
1. 游戏背景（世界观、故事情节）
2. 玩法机制（基本规则、特殊玩法）
3. 奖励设计（普通奖励、大奖机制）
4. 特殊符号设计（Wild、Scatter、Bonus等）
5. RTP 建议（合理的回报率范围）`;
  }

  const messages = [
    {
      role: "user",
      content: `请根据以下主题生成详细的 Slot 游戏策划案：

主题：${theme}${formatInstruction}

请用专业、详细的方式输出，使用Markdown格式。`
    }
  ];

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        messages: messages
      })
    });

    const data = await res.json();

    if (!data.success) {
      throw new Error(data.details || data.error || "生成失败");
    }

    currentPlan = data.content;
    planOutput.textContent = currentPlan;
    
    copyPlanBtn.style.display = "inline-block";
    
    // 进入第二步
    updateSteps(2);
    
    // 如果已经选择了工具，启用提取按钮
    if (selectedTool) {
      extractArtBtn.disabled = false;
    }
    
    showInfo("success", "策划案生成成功！请选择AI绘画工具并提取提示词 →");

  } catch (err) {
    planOutput.textContent = "❌ 生成失败：\n" + err.message;
    showInfo("warning", "生成失败：" + err.message);
    console.error("错误详情:", err);
  } finally {
    startGenerateBtn.disabled = false;
    startGenerateBtn.innerHTML = '🚀 开始生成策划案';
  }
});

// 第三步：提取美术提示词
extractArtBtn.addEventListener("click", async () => {
  if (!currentPlan) {
    showInfo("warning", "请先生成策划案！");
    return;
  }

  if (!selectedTool) {
    showInfo("warning", "请先选择AI绘画工具！");
    return;
  }

  extractArtBtn.disabled = true;
  extractArtBtn.innerHTML = '<span class="loading"></span> 提取中...';
  artOutput.textContent = "⏳ 正在根据选择的工具生成提示词...";
  

  const theme = themeInput.value.trim();
  const tool = toolConfig[selectedTool];
  
  // 获取参数值
  const stylize = styleSlider ? styleSlider.value : 100;
  const weird = weirdSlider ? weirdSlider.value : 0;
  const cfg = cfgSlider ? cfgSlider.value : 7;
  const steps = stepsSlider ? stepsSlider.value : 20;
  const domesticStyle = domesticStyleSelect ? domesticStyleSelect.value : "写实";
  const quality = qualitySelect ? qualitySelect.value : "标准";

  // 根据选择的工具构建提示词要求
  let toolInstruction = `请为 ${tool.name} 生成AI绘画提示词。

工具特点：${tool.description}
格式要求：${tool.format}
要求：${tool.promptRequirements}`;

  if (selectedTool === 'midjourney') {
    toolInstruction += `\n\n参数设置：
- 风格化程度: ${stylize}
- 怪异度: ${weird}
请在生成的提示词末尾添加对应参数，如 --stylize ${stylize} --weird ${weird}`;
  } else if (selectedTool === 'sd') {
    toolInstruction += `\n\n参数设置：
- CFG Scale: ${cfg}
- 采样步数: ${steps}
请在提示词中考虑这些参数的影响。`;
  } else {
    toolInstruction += `\n\n风格偏好：${domesticStyle}
质量要求：${quality}
请根据这些偏好调整提示词，使用中文描述为主。`;
  }

  const messages = [
    {
      role: "user",
      content: `请根据以下Slot游戏策划案，${toolInstruction}

策划案内容：
${currentPlan}

主题：${theme}

要求生成5个不同的美术提示词，覆盖以下方面：
1. 游戏主视觉图 - 用于游戏大厅展示
2. 角色设计 - 主要角色或符号
3. 场景背景 - 转轮背景
4. 特殊符号图标 - Wild、Scatter等
5. 奖励动画场景 - 中奖特效

请用以下格式清晰输出：

🎨 【类型】游戏主视觉
Prompt: [适合${tool.name}的提示词，严格按照工具格式]
中文描述：[中文说明]
适用场景：[具体用途]

🎨 【类型】角色设计
Prompt: [适合${tool.name}的提示词]
...`
    }
  ];

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        messages: messages
      })
    });

    const data = await res.json();

    if (!data.success) {
      throw new Error(data.details || data.error || "提取失败");
    }

    currentArtPrompt = data.content;
    artOutput.textContent = currentArtPrompt;
    
    copyArtBtn.style.display = "inline-block";
    
    // 进入第三步
    updateSteps(3);
    
    showInfo("success", `已为 ${tool.name} 生成提示词！可以复制使用 ✨`);

  } catch (err) {
    artOutput.textContent = "❌ 提取失败：\n" + err.message;
    showInfo("warning", "提取失败：" + err.message);
    console.error("错误详情:", err);
  } finally {
    extractArtBtn.disabled = false;
    extractArtBtn.innerHTML = '🎨 2. 从策划案提取美术提示词';
  }
});

// 参数滑块事件
if (styleSlider) {
  styleSlider.addEventListener("input", () => {
    styleValue.textContent = styleSlider.value;
  });
}

if (weirdSlider) {
  weirdSlider.addEventListener("input", () => {
    weirdValue.textContent = weirdSlider.value;
  });
}

if (cfgSlider) {
  cfgSlider.addEventListener("input", () => {
    cfgValue.textContent = cfgSlider.value;
  });
}

if (stepsSlider) {
  stepsSlider.addEventListener("input", () => {
    stepsValue.textContent = stepsSlider.value;
  });
}

// 复制策划案
copyPlanBtn.addEventListener("click", () => {
  if (!currentPlan) return;
  
  navigator.clipboard.writeText(currentPlan).then(() => {
    const originalText = copyPlanBtn.textContent;
    copyPlanBtn.textContent = "✅ 已复制！";
    setTimeout(() => {
      copyPlanBtn.textContent = originalText;
    }, 2000);
    showInfo("success", "策划案已复制到剪贴板");
  }).catch(err => {
    showInfo("warning", "复制失败：" + err.message);
  });
});

// 复制美术提示词
copyArtBtn.addEventListener("click", () => {
  if (!currentArtPrompt) return;
  
  navigator.clipboard.writeText(currentArtPrompt).then(() => {
    const originalText = copyArtBtn.textContent;
    copyArtBtn.textContent = "✅ 已复制！";
    setTimeout(() => {
      copyArtBtn.textContent = originalText;
    }, 2000);
    showInfo("success", "提示词已复制到剪贴板");
  }).catch(err => {
    showInfo("warning", "复制失败：" + err.message);
  });
});

// 初始化
themeInput.value = "古埃及宝藏主题 Slot";
formatInput.value = formatPresets.standard;
currentFormat = formatPresets.standard;
updateSteps(1); // 从第一步开始
</script>
