<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Slot AI Studio</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    textarea { width: 100%; height: 100px; margin-bottom: 10px; }
    select, button { padding: 10px; margin-right: 10px; font-size: 16px; }
    pre { background: #f0f0f0; padding: 10px; white-space: pre-wrap; }
    hr { margin: 20px 0; }
  </style>
</head>
<body>

<h1>🎰 Slot AI Studio</h1>

<!-- 模型选择 -->
<label>选择模型:</label>
<select id="modelSelect">
  <option value="deepseek/deepseek-v3.2-251201">DeepSeek V3.2</option>
  <option value="anthropic/claude-v1">Claude V1</option>
  <option value="gemini/gemini-1">Gemini-1</option>
</select>

<hr>

<h2>输入 Slot 游戏主题</h2>
<textarea id="themeInput" placeholder="例如：古埃及宝藏主题 Slot"></textarea>
<br>
<button id="generateBtn">生成策划案</button>

<hr>

<h2>生成结果</h2>
<pre id="output">等待生成...</pre>

<script>
const modelSelect = document.getElementById("modelSelect");
const themeInput = document.getElementById("themeInput");
const generateBtn = document.getElementById("generateBtn");
const output = document.getElementById("output");

// API Key 和 BaseURL 配置
const apiKeys = {
  "deepseek/deepseek-v3.2-251201": "你的DeepSeekKey",
  "anthropic/claude-v1": "你的ClaudeKey",
  "gemini/gemini-1": "你的GeminiKey"
};

const baseURLs = {
  "deepseek/deepseek-v3.2-251201": "https://api.qnaigc.com/v1",
  "anthropic/claude-v1": "https://api.qnaigc.com",
  "gemini/gemini-1": "https://api.qnaigc.com"
};

generateBtn.addEventListener("click", async () => {
  const theme = themeInput.value.trim();

  if (!theme) {
    alert("请输入游戏主题！");
    return;
  }

  output.textContent = "生成中...";

  const model = modelSelect.value;

  const messages = [
    {
      role: "user",
      content: `请根据以下主题生成详细的 Slot 游戏策划案：\n\n主题：${theme}\n\n要求包含：\n1. 游戏背景\n2. 玩法机制\n3. 奖励设计\n4. 特殊符号设计\n5. RTP 建议`
    }
  ];

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model,
        baseURL: baseURLs[model],
        apiKey: apiKeys[model],
        messages
      })
    });

    const data = await res.json();

    if (!data.success) {
      output.textContent = "生成失败：\n" + (data.error || "未知错误");
      return;
    }

    output.textContent = data.content;

  } catch (err) {
    output.textContent = "请求出错：\n" + err.message;
  }
});
</script>

</body>
</html>
