<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot AI Studio - 两步生成</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body { 
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* 步骤指示器 */
    .step-indicator {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      position: relative;
    }

    .step-indicator::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255,255,255,0.2);
      transform: translateY(-50%);
      z-index: 1;
    }

    .step {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      padding: 12px 30px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      position: relative;
      z-index: 2;
      transition: all 0.3s ease;
    }

    .step.active {
      background: white;
      color: #764ba2;
      border-color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .step.completed {
      background: #4CAF50;
      border-color: #4CAF50;
      color: white;
    }

    /* 主卡片 */
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-header h2 {
      color: #333;
      font-size: 24px;
      font-weight: 600;
    }

    .card-header .step-badge {
      background: #667eea;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 15px;
    }

    /* 输入区域 */
    .input-group {
      margin-bottom: 25px;
    }

    .input-group label {
      display: block;
      color: #555;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea { 
      width: 100%; 
      height: 120px; 
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      resize: vertical;
      font-family: inherit;
      transition: all 0.3s;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }

    /* 按钮样式 */
    .button-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102,126,234,0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #666;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e0e0e0;
      transform: translateY(-2px);
    }

    .btn-success {
      background: #4CAF50;
      color: white;
    }

    .btn-success:hover:not(:disabled) {
      background: #45a049;
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* 内容区域 */
    .content-area {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      border: 1px solid #e9ecef;
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .content-header h3 {
      color: #333;
      font-size: 18px;
    }

    pre { 
      background: white;
      padding: 20px;
      border-radius: 8px;
      white-space: pre-wrap; 
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid #e9ecef;
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Consolas', monospace;
    }

    /* 复制按钮 */
    .copy-btn {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
      color: #666;
    }

    .copy-btn:hover {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    /* 提示信息 */
    .info-message {
      background: #e3f2fd;
      border-radius: 8px;
      padding: 12px;
      color: #1976d2;
      font-size: 14px;
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-message.warning {
      background: #fff3e0;
      color: #f57c00;
    }

    .info-message.success {
      background: #e8f5e8;
      color: #4CAF50;
    }

    hr {
      margin: 30px 0;
      border: none;
      border-top: 2px dashed #e0e0e0;
    }

    /* 加载动画 */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .step {
        padding: 8px 16px;
        font-size: 14px;
      }
      
      .btn {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- 步骤指示器 -->
  <div class="step-indicator">
    <div class="step active" id="step1">1. 输入主题</div>
    <div class="step" id="step2">2. 生成策划案</div>
    <div class="step" id="step3">3. 提取美术提示词</div>
  </div>

  <!-- 第一步：输入主题卡片 -->
  <div class="card" id="step1Card">
    <div class="card-header">
      <div class="step-badge">1</div>
      <h2>输入游戏主题</h2>
    </div>
    
    <div class="input-group">
      <label>🎰 Slot 游戏主题</label>
      <textarea id="themeInput" placeholder="例如：古埃及宝藏主题 Slot&#10;或者：海洋冒险主题 Slot&#10;或者：水果乐园主题 Slot">古埃及宝藏主题 Slot</textarea>
    </div>

    <div class="button-group">
      <button id="startGenerateBtn" class="btn btn-primary">
        🚀 开始生成策划案
      </button>
    </div>
  </div>

  <!-- 第二步：策划案卡片 -->
  <div class="card" id="step2Card" style="opacity: 0.5; pointer-events: none;">
    <div class="card-header">
      <div class="step-badge">2</div>
      <h2>生成的策划案</h2>
    </div>

    <div class="content-area">
      <div class="content-header">
        <h3>📋 完整游戏策划案</h3>
        <button id="copyPlanBtn" class="copy-btn" style="display: none;">📋 复制策划案</button>
      </div>
      <pre id="planOutput">等待生成策划案...</pre>
    </div>

    <div style="margin-top: 20px;">
      <button id="extractArtBtn" class="btn btn-success" disabled>
        🎨 从策划案提取美术提示词
      </button>
    </div>
  </div>

  <!-- 第三步：美术提示词卡片 -->
  <div class="card" id="step3Card" style="opacity: 0.5; pointer-events: none;">
    <div class="card-header">
      <div class="step-badge">3</div>
      <h2>美术提示词</h2>
    </div>

    <div class="content-area">
      <div class="content-header">
        <h3>🎨 AI绘画提示词</h3>
        <button id="copyArtBtn" class="copy-btn" style="display: none;">📋 复制提示词</button>
      </div>
      <pre id="artOutput">提取美术提示词后显示...</pre>
    </div>

    <!-- 提示信息区域 -->
    <div id="infoMessage" class="info-message" style="display: none;"></div>
  </div>
</div>

<script>
// 获取DOM元素
const themeInput = document.getElementById("themeInput");
const startGenerateBtn = document.getElementById("startGenerateBtn");
const extractArtBtn = document.getElementById("extractArtBtn");
const copyPlanBtn = document.getElementById("copyPlanBtn");
const copyArtBtn = document.getElementById("copyArtBtn");
const planOutput = document.getElementById("planOutput");
const artOutput = document.getElementById("artOutput");
const infoMessage = document.getElementById("infoMessage");

// 步骤元素
const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const step3 = document.getElementById("step3");
const step1Card = document.getElementById("step1Card");
const step2Card = document.getElementById("step2Card");
const step3Card = document.getElementById("step3Card");

// 存储数据
let currentPlan = "";
let currentArtPrompt = "";

// 固定的模型配置
const MODEL = "deepseek/deepseek-v3.2-251201";

// 更新步骤状态
function updateSteps(step) {
  // 重置所有步骤
  step1.className = "step";
  step2.className = "step";
  step3.className = "step";
  
  // 根据当前步骤设置样式
  if (step >= 1) {
    step1.className = "step completed";
  }
  if (step >= 2) {
    step2.className = "step active";
    step2Card.style.opacity = "1";
    step2Card.style.pointerEvents = "auto";
  }
  if (step >= 3) {
    step2.className = "step completed";
    step3.className = "step active";
    step3Card.style.opacity = "1";
    step3Card.style.pointerEvents = "auto";
  }
}

// 显示信息提示
function showInfo(type, message) {
  infoMessage.style.display = "flex";
  infoMessage.className = `info-message ${type}`;
  
  const icon = type === "success" ? "✅" : type === "warning" ? "⚠️" : "ℹ️";
  infoMessage.innerHTML = `${icon} ${message}`;
  
  // 3秒后自动隐藏
  setTimeout(() => {
    infoMessage.style.display = "none";
  }, 3000);
}

// 第一步：生成策划案
startGenerateBtn.addEventListener("click", async () => {
  const theme = themeInput.value.trim();

  if (!theme) {
    showInfo("warning", "请输入游戏主题！");
    return;
  }

  // 禁用按钮，显示加载状态
  startGenerateBtn.disabled = true;
  startGenerateBtn.innerHTML = '<span class="loading"></span> 生成中...';
  planOutput.textContent = "⏳ 正在生成策划案，请稍候...";
  
  // 更新步骤到2
  updateSteps(2);

  const messages = [
    {
      role: "user",
      content: `请根据以下主题生成详细的 Slot 游戏策划案：

主题：${theme}

要求包含：
1. 游戏背景（世界观、故事情节）
2. 玩法机制（基本规则、特殊玩法）
3. 奖励设计（普通奖励、大奖机制）
4. 特殊符号设计（Wild、Scatter、Bonus等）
5. RTP 建议（合理的回报率范围）

请用专业、详细的方式输出，使用Markdown格式。`
    }
  ];

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        messages: messages
      })
    });

    const data = await res.json();

    if (!data.success) {
      throw new Error(data.details || data.error || "生成失败");
    }

    // 保存策划案内容
    currentPlan = data.content;
    planOutput.textContent = currentPlan;
    
    // 启用提取按钮和复制按钮
    extractArtBtn.disabled = false;
    copyPlanBtn.style.display = "inline-block";
    
    showInfo("success", "策划案生成成功！点击下方按钮提取美术提示词 →");

  } catch (err) {
    planOutput.textContent = "❌ 生成失败：\n" + err.message;
    showInfo("warning", "生成失败：" + err.message);
    console.error("错误详情:", err);
  } finally {
    startGenerateBtn.disabled = false;
    startGenerateBtn.innerHTML = '🚀 开始生成策划案';
  }
});

// 第二步：提取美术提示词
extractArtBtn.addEventListener("click", async () => {
  if (!currentPlan) {
    showInfo("warning", "请先生成策划案！");
    return;
  }

  // 禁用按钮，显示加载状态
  extractArtBtn.disabled = true;
  extractArtBtn.innerHTML = '<span class="loading"></span> 提取中...';
  artOutput.textContent = "⏳ 正在从策划案中提取美术提示词...";
  
  // 更新步骤到3
  updateSteps(3);

  const theme = themeInput.value.trim();

  const messages = [
    {
      role: "user",
      content: `请根据以下Slot游戏策划案，生成详细的AI绘画提示词。

策划案内容：
${currentPlan}

主题：${theme}

要求生成5-8个不同的美术提示词，覆盖以下方面：
1. 游戏主视觉图 - 用于游戏大厅展示
2. 角色设计 - 主要角色或符号
3. 场景背景 - 转轮背景
4. 特殊符号图标 - Wild、Scatter等
5. 奖励动画场景 - 中奖特效

每个提示词要求包含：
- 详细的风格描述（赛博朋克/卡通/写实/幻想等）
- 色彩方案（主色调、配色）
- 构图建议（视角、布局）
- 光影效果（照明、氛围）
- 技术参数（适合Midjourney/Stable Diffusion）

请用以下格式清晰输出：

🎨 【类型】游戏主视觉
Prompt: [英文提示词]
中文描述：[中文说明]
适用场景：[具体用途]

🎨 【类型】角色设计
Prompt: [英文提示词]
...`
    }
  ];

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        messages: messages
      })
    });

    const data = await res.json();

    if (!data.success) {
      throw new Error(data.details || data.error || "提取失败");
    }

    // 保存美术提示词
    currentArtPrompt = data.content;
    artOutput.textContent = currentArtPrompt;
    
    // 显示复制按钮
    copyArtBtn.style.display = "inline-block";
    
    showInfo("success", "美术提示词生成成功！可以复制到Midjourney等工具使用 ✨");

  } catch (err) {
    artOutput.textContent = "❌ 提取失败：\n" + err.message;
    showInfo("warning", "提取失败：" + err.message);
    console.error("错误详情:", err);
  } finally {
    extractArtBtn.disabled = false;
    extractArtBtn.innerHTML = '🎨 从策划案提取美术提示词';
  }
});

// 复制策划案
copyPlanBtn.addEventListener("click", () => {
  if (!currentPlan) return;
  
  navigator.clipboard.writeText(currentPlan).then(() => {
    const originalText = copyPlanBtn.textContent;
    copyPlanBtn.textContent = "✅ 已复制！";
    setTimeout(() => {
      copyPlanBtn.textContent = originalText;
    }, 2000);
    showInfo("success", "策划案已复制到剪贴板");
  }).catch(err => {
    showInfo("warning", "复制失败：" + err.message);
  });
});

// 复制美术提示词
copyArtBtn.addEventListener("click", () => {
  if (!currentArtPrompt) return;
  
  navigator.clipboard.writeText(currentArtPrompt).then(() => {
    const originalText = copyArtBtn.textContent;
    copyArtBtn.textContent = "✅ 已复制！";
    setTimeout(() => {
      copyArtBtn.textContent = originalText;
    }, 2000);
    showInfo("success", "提示词已复制到剪贴板");
  }).catch(err => {
    showInfo("warning", "复制失败：" + err.message);
  });
});

// 初始化示例主题
themeInput.value = "古埃及宝藏主题 Slot";
</script>

</body>
</html>
