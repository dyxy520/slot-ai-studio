<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Slot AI Studio</title>
<style>
  /* 页面基础样式 */
  body { font-family: sans-serif; margin: 20px; background:#f0f0f0; }
  .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }
  textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; font-size: 16px; }
  select, button { font-size: 16px; margin-right: 10px; padding: 5px; }
  .output { margin-top: 20px; white-space: pre-wrap; background:#f9f9f9; padding:10px; border-radius:5px; min-height:100px; }
</style>
</head>
<body>
<div class="container">
  <h2>Slot AI Studio</h2>

  <!-- 用户输入 slot 游戏主题 -->
  <label>游戏主题：</label>
  <textarea id="theme" placeholder="请输入 slot 游戏主题..."></textarea>

  <!-- 模型选择 -->
  <label>选择模型：</label>
  <select id="modelSelect">
    <option value="deepseek/deepseek-v3.2-251201">DeepSeek V3.2</option>
    <!-- 后续可以添加更多模型 -->
  </select>

  <br><br>
  <button id="sendBtn">生成策划案</button>

  <!-- 输出结果区域 -->
  <div class="output" id="output"></div>
</div>

<script>
  // 获取 DOM 元素
  const sendBtn = document.getElementById('sendBtn');
  const output = document.getElementById('output');
  const themeInput = document.getElementById('theme');
  const modelSelect = document.getElementById('modelSelect');

  // 点击按钮事件
  sendBtn.addEventListener('click', async () => {
    const theme = themeInput.value.trim(); // 获取用户输入主题
    const model = modelSelect.value;       // 获取选择的模型

    if (!theme) { 
      alert("请输入游戏主题！"); 
      return; 
    }

    output.textContent = "生成中，请稍候..."; // 显示 loading

    try {
      // 调用 serverless function，不在前端写 apiKey
      const res = await fetch('/api/generate', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model,
          messages: [{ role: "user", content: `请根据这个主题生成 slot 游戏策划案: ${theme}` }]
        })
      });

      const data = await res.json();

      // 显示返回内容
      if(data.success){
        output.textContent = data.content;
      } else {
        output.textContent = JSON.stringify(data, null, 2);
      }

    } catch (err) {
      output.textContent = "调用失败：" + err.message;
    }
  });
</script>
</body>
</html>
